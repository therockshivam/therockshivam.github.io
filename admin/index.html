<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio CMS | Login</title>

    <base href="../" />
    <link rel="stylesheet" href="css/admin-login.css">

    <!-- Modular Firebase Web Auth script -->
    <script type="module" src="js/auth.js"></script>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="logo">🚀</div>

            <h1>Portfolio CMS</h1>

            <p class="subtitle">Secure Administrator Portal</p>

            <div id="error-banner" class="error-banner"></div>

            <form id="login-form">

                <div class="form-group">
                    <label for="admin-email">Admin Email</label>
                    <input type="email" id="admin-email" class="form-input" placeholder="admin@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="login-btn" class="submit-btn">
                    Sign In
                </button>

            </form>

            <small>
                Only authorized portfolio administrators can access this portal.
            </small>

        </div>

    </main>

</body>

</html>
