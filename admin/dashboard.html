<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio CMS | Admin Dashboard</title>

    <base href="../" />
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <!-- Styles -->
    <link rel="stylesheet" href="css/admin-dashboard.css">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-layer-group"></i>
            <span>Portfolio CMS</span>
        </div>

        <nav>

            <a class="menu active" data-page="dashboard">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a class="menu" data-page="projects">
                <i class="fa-solid fa-laptop-code"></i>
                <span>Projects</span>
            </a>

            <a class="menu" data-page="tools">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                <span>Tools</span>
            </a>

            <a class="menu" data-page="notes">
                <i class="fa-solid fa-book-bookmark"></i>
                <span>Vault Notes</span>
            </a>

            <a class="menu" data-page="profile">
                <i class="fa-solid fa-user-gear"></i>
                <span>Profile</span>
            </a>

            <a class="menu" data-page="resume">
                <i class="fa-solid fa-file-invoice"></i>
                <span>Resume</span>
            </a>

            <a class="menu" data-page="messages">
                <i class="fa-solid fa-envelope"></i>
                <span>Messages</span>
            </a>

            <a id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>

        </nav>

    </aside>

    <!-- Main Content Area -->
    <main class="main">

        <!-- Header -->
        <header>

            <div>
                <h1 id="pageTitle">Dashboard</h1>
                <small id="userEmailBadge">Welcome Administrator</small>
            </div>

            <div class="header-right">

                <button id="refreshBtn">
                    <i class="fa-solid fa-rotate"></i>
                    Refresh
                </button>

                <img
                    src="https://ui-avatars.com/api/?name=Admin"
                    class="avatar"
                    id="adminAvatar"
                    alt="Admin Avatar">

            </div>

        </header>

        <!-- Dynamic View Content Container -->
        <section id="content">

            <!-- Dashboard Overview Page -->
            <div id="dashboardPage">

                <div class="cards">

                    <div class="card">
                        <h4>Total Projects</h4>
                        <h2 id="projectCount">0</h2>
                    </div>

                    <div class="card">
                        <h4>Total Tools</h4>
                        <h2 id="toolCount">0</h2>
                    </div>

                    <div class="card">
                        <h4>Vault Notes</h4>
                        <h2 id="noteCount">0</h2>
                    </div>

                    <div class="card">
                        <h4>Contact Messages</h4>
                        <h2 id="messageCount">0</h2>
                    </div>

                </div>

                <div class="section">

                    <div class="section-header">
                        <h2>Collections Overview</h2>
                    </div>

                    <div id="tableList">
                        <!-- Dynamic Collection Cards -->
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<!-- Global Modal Container -->
<div id="modalContainer"></div>

<!-- Toast Notifications -->
<div id="toastContainer"></div>

<!-- Modular Admin Script Entry -->
<script type="module" src="js/admin/app.js"></script>

</body>
</html>
